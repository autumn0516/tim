<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#0f172a">
    <title>工作流编辑器 - AI短视频生成工具</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/workflow.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="workflow-container">
        <!-- 顶部工具栏 -->
        <header class="workflow-header">
            <div class="header-left">
                <a href="/" class="btn-back">
                    <i class="fas fa-arrow-left"></i>
                    <span>返回主页</span>
                </a>
                <h1><i class="fas fa-project-diagram"></i> 工作流编辑器</h1>
            </div>
            <div class="header-center">
                <input type="text" id="workflowName" class="workflow-name-input" placeholder="未命名工作流" value="我的视频工作流">
            </div>
            <div class="header-right">
                <button class="btn-secondary" onclick="saveWorkflow()">
                    <i class="fas fa-save"></i>
                    <span>保存</span>
                </button>
                <button class="btn-secondary" onclick="loadWorkflow()">
                    <i class="fas fa-folder-open"></i>
                    <span>加载</span>
                </button>
                <button class="btn-primary" onclick="executeWorkflow()">
                    <i class="fas fa-play"></i>
                    <span>执行工作流</span>
                </button>
            </div>
        </header>

        <div class="workflow-main">
            <!-- 左侧节点面板 -->
            <aside class="node-palette">
                <div class="palette-header">
                    <h3><i class="fas fa-cubes"></i> 节点库</h3>
                </div>
                <div class="palette-content">
                    <!-- 输入节点 -->
                    <div class="node-category">
                        <h4><i class="fas fa-download"></i> 输入</h4>
                        <div class="node-item" draggable="true" data-node-type="image">
                            <i class="fas fa-images"></i>
                            <span>图片输入</span>
                        </div>
                        <div class="node-item" draggable="true" data-node-type="text">
                            <i class="fas fa-font"></i>
                            <span>文本输入</span>
                        </div>
                        <div class="node-item" draggable="true" data-node-type="audio">
                            <i class="fas fa-music"></i>
                            <span>音频输入</span>
                        </div>
                    </div>

                    <!-- 处理节点 -->
                    <div class="node-category">
                        <h4><i class="fas fa-magic"></i> 处理</h4>
                        <div class="node-item" draggable="true" data-node-type="effect">
                            <i class="fas fa-wand-magic-sparkles"></i>
                            <span>视频特效</span>
                        </div>
                        <div class="node-item" draggable="true" data-node-type="filter">
                            <i class="fas fa-sliders-h"></i>
                            <span>图片滤镜</span>
                        </div>
                        <div class="node-item" draggable="true" data-node-type="transition">
                            <i class="fas fa-exchange-alt"></i>
                            <span>转场效果</span>
                        </div>
                    </div>

                    <!-- 输出节点 -->
                    <div class="node-category">
                        <h4><i class="fas fa-upload"></i> 输出</h4>
                        <div class="node-item" draggable="true" data-node-type="video_generator">
                            <i class="fas fa-video"></i>
                            <span>视频生成</span>
                        </div>
                    </div>
                </div>

                <!-- 快捷操作 -->
                <div class="palette-footer">
                    <button class="btn-tool" onclick="clearCanvas()" title="清空画布">
                        <i class="fas fa-trash"></i>
                    </button>
                    <button class="btn-tool" onclick="fitToScreen()" title="适应屏幕">
                        <i class="fas fa-expand"></i>
                    </button>
                    <button class="btn-tool" onclick="zoomIn()" title="放大">
                        <i class="fas fa-search-plus"></i>
                    </button>
                    <button class="btn-tool" onclick="zoomOut()" title="缩小">
                        <i class="fas fa-search-minus"></i>
                    </button>
                </div>
            </aside>

            <!-- 中间画布区域 -->
            <div class="canvas-area">
                <canvas id="workflowCanvas"></canvas>
                <div class="canvas-info">
                    <span id="canvasZoom">100%</span>
                    <span id="nodeCount">0 个节点</span>
                </div>
            </div>

            <!-- 右侧属性面板 -->
            <aside class="properties-panel" id="propertiesPanel">
                <div class="panel-header">
                    <h3><i class="fas fa-cog"></i> 节点属性</h3>
                    <button class="btn-close" onclick="closePropertiesPanel()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="panel-content" id="propertiesContent">
                    <div class="empty-state">
                        <i class="fas fa-hand-pointer"></i>
                        <p>选择一个节点查看属性</p>
                    </div>
                </div>
            </aside>
        </div>

        <!-- 执行进度模态框 -->
        <div class="modal" id="executionModal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3><i class="fas fa-cogs"></i> 执行工作流</h3>
                </div>
                <div class="modal-body">
                    <div class="progress-bar">
                        <div class="progress-fill" id="executionProgress"></div>
                    </div>
                    <p class="progress-text" id="executionStatus">准备执行...</p>
                    <div class="execution-log" id="executionLog"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn-secondary" onclick="closeExecutionModal()">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/workflow.js') }}"></script>
</body>
</html>
